name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run compile

      - name: Build Chrome
        run: npm run build

      - name: Build Edge
        run: npm run build:edge

      - name: Verify content script is ASCII
        run: |
          node -e "const fs=require('fs');const p='.output/chrome-mv3/content-scripts/content.js';const b=fs.readFileSync(p);if([...b].some(x=>x>127)){console.error('content.js contains non-ASCII bytes');process.exit(1)}"
