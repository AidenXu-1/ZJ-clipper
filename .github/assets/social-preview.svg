<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="0.58" stop-color="#172554" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.34" />
      <stop offset="1" stop-color="#fb923c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#background)" />
  <circle cx="1090" cy="72" r="300" fill="url(#glow)" />
  <circle cx="1160" cy="560" r="220" fill="url(#glow)" opacity="0.55" />

