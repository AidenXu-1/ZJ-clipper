[project]
name = "nomo-local-transcriber"
version = "2.0.3"
description = "Nomo Clipper local Douyin speech-to-text helper"
requires-python = ">=3.10,<3.13"
dependencies = [
  "faster-whisper>=1.2.1,<2",
]

[project.optional-dependencies]
gpu = [
  "nvidia-cublas-cu12>=12.6,<13",
  "nvidia-cudnn-cu12>=9,<10",
]

[tool.uv]
package = false
